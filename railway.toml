[build]
# Prefer Dockerfile (Node 22.13+) so node:sqlite works for SqliteLocalAgentStore.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Prefer clearing Custom Start Command in Railway UI so Dockerfile CMD runs.
# This startCommand also uses the Jsonl sqlite shim + PORT from env.
startCommand = "node scripts/serve.mjs"
restartPolicyType = "ON_FAILURE"

[variables]
# Fallback if the service is switched back to Nixpacks.
NIXPACKS_NODE_VERSION = "22"
