[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# MUST be serve.mjs — do NOT use `npx @grok/agent-sdk serve` (segfaults on sqlite).
# In Railway UI: set Custom Start Command to exactly: node scripts/serve.mjs
# or clear it so this / Dockerfile CMD applies.
startCommand = "node scripts/serve.mjs"
restartPolicyType = "ON_FAILURE"

[variables]
NIXPACKS_NODE_VERSION = "22"
