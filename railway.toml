[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway production uses OpenAI chat-server (Agent SDK serve SIGSEGVs here).
# Custom Start Command: node scripts/chat-server.mjs
startCommand = "node scripts/chat-server.mjs"
restartPolicyType = "ON_FAILURE"

[variables]
NIXPACKS_NODE_VERSION = "22"
